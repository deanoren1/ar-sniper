name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler whoami > who.log 2>&1 || true
          npx wrangler deploy > deploy.log 2>&1
          code=$?
          echo "::notice title=Deploy log::$(tail -30 deploy.log | tr '\n' ' ' | cut -c1-1500)"
          echo "::notice title=Whoami::$(tail -15 who.log | tr '\n' ' ' | cut -c1-900)"
          exit $code
      - name: Gemini key
        if: steps.check.outputs.ready == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            printf '%s' "$GEMINI_API_KEY" | npx wrangler secret put GEMINI_API_KEY
          else
            echo "::warning::GEMINI_API_KEY secret is not set, /restyle stays disabled"
          fi
      - name: OpenAI key
        if: steps.check.outputs.ready == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_QUALITY: ${{ vars.OPENAI_IMAGE_QUALITY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            printf '%s' "$OPENAI_API_KEY" | npx wrangler secret put OPENAI_API_KEY
            [ -n "$OPENAI_IMAGE_MODEL" ] && printf '%s' "$OPENAI_IMAGE_MODEL" | npx wrangler secret put OPENAI_IMAGE_MODEL
            [ -n "$OPENAI_IMAGE_QUALITY" ] && printf '%s' "$OPENAI_IMAGE_QUALITY" | npx wrangler secret put OPENAI_IMAGE_QUALITY
            true
          else
            echo "::warning::OPENAI_API_KEY secret is not set, OpenAI provider disabled"
          fi
      - name: Muapi keys
        if: steps.check.outputs.ready == 'true'
        env:
          MUAPI_KEY: ${{ secrets.SNAPBOO }}
          MUAPI_KEY_TEST: ${{ secrets.SNAPBOO_TEST }}
        run: |
          if [ -n "$MUAPI_KEY" ]; then
            printf '%s' "$MUAPI_KEY" | npx wrangler secret put MUAPI_KEY
          else
            echo "::warning::SNAPBOO secret is not set, Muapi real key disabled"
          fi
          if [ -n "$MUAPI_KEY_TEST" ]; then
            printf '%s' "$MUAPI_KEY_TEST" | npx wrangler secret put MUAPI_KEY_TEST
          else
            echo "::warning::SNAPBOO_TEST secret is not set, Muapi sandbox key disabled"
          fi
      - name: Show address
        if: steps.check.outputs.ready == 'true'
        run: grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | sed 's/^/::notice title=Server address::/'
