name: Deploy server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloudflare secrets are not set, skipping deploy"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
      - name: Install
        if: steps.check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          npx wrangler whoami > who.log 2>&1 || true
          npx wrangler deploy > deploy.log 2>&1
          code=$?
          echo "::notice title=Deploy log::$(tail -30 deploy.log | tr '\n' ' ' | cut -c1-1500)"
          echo "::notice title=Whoami::$(tail -15 who.log | tr '\n' ' ' | cut -c1-900)"
          exit $code
      - name: Show address
        if: steps.check.outputs.ready == 'true'
        run: grep -o 'https://[^ ]*workers.dev' deploy.log | head -1 | sed 's/^/::notice title=Server address::/'
