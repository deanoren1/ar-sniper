name: Server check

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: |
          if ! npm install --no-audit --no-fund > npm.log 2>&1; then
            echo "::error::$(tail -25 npm.log | tr '\n' ' ' | cut -c1-1500)"
            exit 1
          fi
      - run: npx tsc
      - name: Start local worker
        run: |
          npx wrangler dev --local --port 8787 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fs http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 2
          done
      - name: Relay integration test
        run: |
          if ! node test/relay.test.mjs > test.log 2>&1; then
            echo "::error::TEST: $(tail -15 test.log | tr '\n' ' ' | cut -c1-900) WORKER: $(tail -15 wrangler.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
      - name: Show worker log on failure
        if: failure()
        run: cat wrangler.log
