name: Generate boss sheet (OpenAI)

on:
  workflow_dispatch:
    inputs:
      design:
        description: "design image path"
        default: "docs/designs/classic_boss.jpg"
      name:
        description: "boss name"
        default: "Classic Behemoth"
      tag:
        description: "output folder name"
        default: "classic_boss"

jobs:
  gen:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pip install --quiet pillow
          mkdir -p out
          set -o pipefail
          python docs/tools/gen_boss_openai.py "${{ inputs.design }}" "${{ inputs.name }}" "out/${{ inputs.tag }}" 2>&1 | tee out/gen.log
      - name: Publish to the gen branch
        if: always()
        run: |
          mkdir -p /tmp/pub
          cp -r out/. /tmp/pub/ || true
          cd /tmp/pub
          git init -q -b gen
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -q -m "Generated ${{ inputs.tag }} from ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gen
