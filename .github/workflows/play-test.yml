name: Play Test (Emulator)

# Runs automatically after every successful "Build APK" on main:
# builds an emulator-compatible APK (arm64 + x86_64) of the same commit
# and lets a robot play it with random input. Red X = crash or freeze.
on:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-test-main
  cancel-in-progress: true

jobs:
  play-test:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Fetch UI font (Oxanium, OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 3 -o app/src/main/res/font/oxanium.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oxanium/Oxanium%5Bwght%5D.ttf"

      - name: Build emulator APK (arm64 + x86_64)
        run: gradle assembleDebug -PemulatorAbi --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Play the game on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          disk-size: 3G
          emulator-boot-timeout: 400
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-metrics -camera-back emulated
          disable-animations: true
          script: bash .github/scripts/play_test.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: play-test-results
          path: play-test-results/
          retention-days: 3
