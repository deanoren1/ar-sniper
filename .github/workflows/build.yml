name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          cache-disabled: true

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug --no-build-cache --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          # שגיאות קומפילציה כהערות על ההרצה (כדי שאפשר לקרוא אותן בלי הלוגים המלאים)
          grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::${l}"; done
          exit $code

      - name: Delete older APK artifacts (keep storage under quota)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[] | select(.workflow_run.id < ${{ github.run_id }}) | .id' | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" --silent || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
