name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
          cache-disabled: true

      - name: Fetch UI font (Oxanium, OFL)
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL --retry 3 -o app/src/main/res/font/oxanium.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/oxanium/Oxanium%5Bwght%5D.ttf"
          ls -l app/src/main/res/font

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          gradle clean assembleDebug -PbuildNumber=${{ github.run_number }} --no-build-cache --stacktrace 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          # שגיאות קומפילציה כהערות על ההרצה (כדי שאפשר לקרוא אותן בלי הלוגים המלאים)
          grep -E "^e: " build.log | head -20 | while read -r l; do echo "::error::${l}"; done
          exit $code

      - name: Delete older APK artifacts (keep storage under quota)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/${{ github.repository }}/actions/artifacts" --jq '.artifacts[] | select(.workflow_run.id < ${{ github.run_id }}) | .id' | while read id; do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id" --silent || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

      # עדכון מתוך המשחק: ה-APK והגרסה עולים ל-R2, והמשחק בודק אותם בפתיחה (snapboo-front.pages.dev/app/latest.json)
      - name: Publish in-app update
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          APK=app/build/outputs/apk/debug/app-debug.apk
          SIZE=$(stat -c %s "$APK")
          NOTES=$(git log -1 --pretty=%s | head -c 300)
          jq -n --argjson v ${{ github.run_number }} --arg n "$NOTES" --argjson s "$SIZE" '{versionCode:$v, notes:$n, size:$s}' > latest.json
          cat latest.json
          npx --yes wrangler@4 r2 object put snapboo-worlds/app/snapboo.apk --file "$APK" --content-type application/vnd.android.package-archive --remote
          npx --yes wrangler@4 r2 object put snapboo-worlds/app/latest.json --file latest.json --content-type application/json --remote
          echo "::notice title=In-app update::Published build ${{ github.run_number }} ($SIZE bytes)"
